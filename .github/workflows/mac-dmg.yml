name: Package released Mac apps as DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            sha256: 583f670419af69a4ba25dd482225bfa9f2bc7aa4cdf55ec09ea9b9e63cea31d0
          - os: macos-15-intel
            arch: x86_64
            sha256: 2c7e2636552b6504697f0c2f25a8b18c567057e89a05f0ca5f4176085e52d72c
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install DMG packaging tools
        run: python3 -m pip install dmgbuild==1.6.7 cryptography
      - name: Verify update rollback and old-version cleanup
        run: python3 outputs/test_updates.py
      - name: Download verified release ZIP
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "https://github.com/Greenbean0123/TEM-graph-tool/releases/download/v0.0.2/TEM-graph-tool-0.0.2-macos-${ARCH}.zip" -o app.zip
      - name: Build, mount and test installed copy
        env:
          ARCH: ${{ matrix.arch }}
          ZIP_SHA256: ${{ matrix.sha256 }}
        run: python3 outputs/build_dmg.py --zip app.zip --sha256 "$ZIP_SHA256" --arch "$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            outputs/dist/*.dmg
            outputs/dist/dmg-*-self-test.json
          if-no-files-found: error
